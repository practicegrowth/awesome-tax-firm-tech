name: Catalog integrity

on:
  pull_request:
    paths:
      - "README.md"
      - "data/tools.json"
      - "scripts/validate-catalog.mjs"
      - ".github/workflows/catalog-integrity.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "data/tools.json"
      - "scripts/validate-catalog.mjs"
      - ".github/workflows/catalog-integrity.yml"
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-catalog.mjs
